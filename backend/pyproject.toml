[project]
name = "easytopics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Steffen Fohr", email = "poststelle@sffn.de" }
]
requires-python = ">=3.12,<3.13" # upper bound due to numba
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
